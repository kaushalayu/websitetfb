# Netlify configuration for The Furniture Boutique

[build]
  publish = "dist"
  command = "npm run build"

# Sitemap proxy — serve dynamic sitemap from backend
[[redirects]]
  from = "/sitemap.xml"
  to = "https://adi-backend-vb6n.onrender.com/sitemap.xml"
  status = 200
  force = true

# SPA routing — all routes serve index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Hashed JS/CSS assets — cache aggressively (1 year)
# Vite adds content hashes to filenames, so these never go stale
[[headers]]
  for = "/assets/*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/*.woff2"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Static plugin files (no hash) — short cache so they refresh after deploy
[[headers]]
  for = "/assets/css/plugins/*"
  [headers.values]
    Cache-Control = "public, max-age=86400, must-revalidate"

[[headers]]
  for = "/assets/js/plugins/*"
  [headers.values]
    Cache-Control = "public, max-age=86400, must-revalidate"

[[headers]]
  for = "/assets/css/style.css"
  [headers.values]
    Cache-Control = "public, max-age=86400, must-revalidate"

[[headers]]
  for = "/assets/css/custom.css"
  [headers.values]
    Cache-Control = "public, max-age=86400, must-revalidate"

# HTML — never cache so users always get the latest
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
    Pragma = "no-cache"

# index.html — never cache
[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
    Pragma = "no-cache"
